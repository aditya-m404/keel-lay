name: keel

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: keel
      POSTGRES_PASSWORD: keel
      POSTGRES_DB: keel
    ports:
      - "127.0.0.1:41532:5432"
    volumes:
      - keel_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keel -d keel"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      KEEL_VENDOR_APP_ENDPOINT: ${KEEL_VENDOR_APP_ENDPOINT:-}
      KEEL_VENDOR_APP_API_KEY: ${KEEL_VENDOR_APP_API_KEY:-}
      KEEL_VENDOR_INFRA_ENDPOINT: ${KEEL_VENDOR_INFRA_ENDPOINT:-}
      KEEL_VENDOR_INFRA_API_KEY: ${KEEL_VENDOR_INFRA_API_KEY:-}
    volumes:
      - ../generated/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4417:4417"
      - "127.0.0.1:4418:4418"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: keel-api:local
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: api
    environment:
      KEEL_ENV: local-prod
      KEEL_BIND: 0.0.0.0
      KEEL_API_ORIGIN: http://127.0.0.1:4101
      KEEL_WEB_ORIGIN: http://127.0.0.1:4100
      KEEL_STUDIO_ORIGIN: http://127.0.0.1:4102
      DATABASE_URL: postgres://keel:keel@postgres:5432/keel
      KEEL_SESSION_SECRET: ${KEEL_SESSION_SECRET:-}
      KEEL_SEED_PASSWORD: ${KEEL_SEED_PASSWORD:-}
      KEEL_SEED: ${KEEL_SEED:-1}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4418
    ports:
      - "127.0.0.1:4101:4101"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4101/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 15s

  web:
    image: keel-web:local
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: web
    environment:
      KEEL_API_ORIGIN: http://api:4101
      KEEL_WEB_ORIGIN: http://127.0.0.1:4100
    ports:
      - "127.0.0.1:4100:4100"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

  studio:
    image: keel-studio:local
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: studio
    environment:
      KEEL_BIND: 0.0.0.0
      KEEL_STUDIO_ORIGIN: http://127.0.0.1:4102
      KEEL_STUDIO_STATIC: /src/apps/studio/dist
      KEEL_TUNNEL_API: api:4101
      KEEL_TUNNEL_WEB: web:4100
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    ports:
      - "127.0.0.1:4102:4102"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4102/targets').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

  openobserve:
    profiles: ["openobserve"]
    image: public.ecr.aws/zinclabs/openobserve:v0.14.5
    environment:
      ZO_ROOT_USER_EMAIL: ada@keel.test
      ZO_ROOT_USER_PASSWORD: keel-local-only
      ZO_LOCAL_MODE_STORAGE: local
    ports:
      - "127.0.0.1:15081:5080"

volumes:
  keel_pg:
