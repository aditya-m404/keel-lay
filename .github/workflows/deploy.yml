name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to redeploy
        required: true
        type: string

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Image tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pin the host key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.KEEL_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Write the server env
        run: |
          ssh -o StrictHostKeyChecking=yes "${{ secrets.KEEL_SSH_TARGET }}" "umask 077 && cat > /root/keel.env && chmod 600 /root/keel.env" <<EOF
          KEEL_ENV=production
          KEEL_SESSION_SECRET=${{ secrets.KEEL_SESSION_SECRET }}
          KEEL_SEED_PASSWORD=${{ secrets.KEEL_SEED_PASSWORD }}
          KEEL_VENDOR_APP_API_KEY=${{ secrets.KEEL_VENDOR_APP_API_KEY }}
          KEEL_VENDOR_INFRA_API_KEY=${{ secrets.KEEL_VENDOR_INFRA_API_KEY }}
          EOF
      - name: Roll forward
        run: |
          tag="${{ steps.tag.outputs.value }}"
          ssh -o StrictHostKeyChecking=yes "${{ secrets.KEEL_SSH_TARGET }}" \
            "cd /opt/keel && KEEL_IMAGE_TAG='${tag}' docker compose -f infra/compose.yaml pull && KEEL_IMAGE_TAG='${tag}' docker compose -f infra/compose.yaml up -d"
      - name: Ready
        run: curl --fail --retry 20 --retry-delay 3 "${{ secrets.KEEL_PUBLIC_ORIGIN }}/ready"
      - name: Record the image tag
        run: echo "image_tag=${{ steps.tag.outputs.value }}" >> "$GITHUB_STEP_SUMMARY"
