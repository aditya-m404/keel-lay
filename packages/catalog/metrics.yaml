metrics:
  - name: http.server.requests
    kind: counter
    signal: app
    description: HTTP requests handled by the API, including 4xx and 5xx.
  - name: http.server.request.duration
    kind: histogram
    unit: ms
    signal: app
    description: Handler time in milliseconds.
  - name: keel.card.created
    kind: counter
    signal: app
    description: Cards saved by POST /cards.
  - name: keel.card.moved
    kind: counter
    signal: app
    description: Cards whose column changed.
  - name: keel.comment.created
    kind: counter
    signal: app
    description: Comments saved on a card.
  - name: keel.card.starred
    kind: counter
    signal: app
    description: First time a person stars a card.
  - name: keel.guard.error_ratio
    kind: gauge
    signal: app
    description: Share of API calls that failed with a 5xx over the last minute. Sent by Studio in a rehearsal.
  - name: keel.guard.p95_ms
    kind: gauge
    unit: ms
    signal: app
    description: 95th percentile handler time over the last minute. Sent by Studio in a rehearsal.
  - name: keel.guard.requests_per_min
    kind: gauge
    signal: app
    description: API calls per minute. Sent by Studio in a rehearsal.
