id: read-board
title: Read the Launch board
feature: board.read
actor: linus
actors: [owner, member, viewer]
steps:
  - id: sign-in
    ui:
      - { goto: /sign-in }
      - { see: Sign in }
      - { fill: { label: Email, text: linus@keel.test } }
      - { fill: { label: Password, text: keel-local-only } }
      - { click: Sign in }
      - { see: Launch }
    api:
      method: POST
      path: /session
      body:
        email: linus@keel.test
        password: keel-local-only
      expect: 201
    thinkMs: { min: 400, max: 1400 }
  - id: read-board
    ui:
      - { goto: /boards/launch }
      - { see: Launch }
    api:
      method: GET
      path: /boards/launch
      expect: 200
    thinkMs: { min: 500, max: 2000 }
